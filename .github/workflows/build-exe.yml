name: Build PDF-Tools to EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*' # تشغيل تلقائي عند إنشاء إصدار جديد (مثل v1.0.0)
  workflow_dispatch: # يسمح بالتشغيل اليدوي من واجهة GitHub

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # متوافق مع المكتبات الموجودة في requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fix app.spec for CI environment
        run: |
          # قراءة ملف app.spec
          $content = Get-Content -Path app.spec -Raw
          
          # إزالة المسار المحلي الثابت واستبداله بمسار نسبي يعمل على GitHub
          $content = $content -replace "pathex=\[.*?\]", "pathex=['.']"
          
          # التأكد من استخدام main.pyw إذا كان main.py غير موجود في أحدث إصدار
          if (-not (Test-Path "main.py") -and (Test-Path "main.pyw")) {
              $content = $content -replace "\['main\.py'\]", "['main.pyw']"
          }
          
          # حفظ التعديلات
          $content | Set-Content -Path app.spec
          Write-Host "تم تحديث app.spec بنجاح لبيئة CI"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm app.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Tools-Windows
          path: dist/PDF-tools/
          if-no-files-found: error
