name: Build Windows EXE

on:
  push:
    branches: [ 4.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Try build with Nuitka (standalone)
        id: nuitka
        continue-on-error: true
        shell: pwsh
        run: |
          pip install nuitka
          python -m nuitka `
            --standalone `
            --enable-plugin=tk-inter `
            --include-package-data=pypdfium2 `
            --nofollow-import-to=PIL.EpsImagePlugin `
            --nofollow-import-to=PIL.FpxImagePlugin `
            --nofollow-import-to=PIL.GbrImagePlugin `
            --nofollow-import-to=PIL.IcnsImagePlugin `
            --nofollow-import-to=PIL.ImtImagePlugin `
            --nofollow-import-to=PIL.McIdasImagePlugin `
            --nofollow-import-to=PIL.MicImagePlugin `
            --nofollow-import-to=PIL.MspImagePlugin `
            --nofollow-import-to=PIL.PalmImagePlugin `
            --nofollow-import-to=PIL.PcdImagePlugin `
            --nofollow-import-to=PIL.PcxImagePlugin `
            --nofollow-import-to=PIL.PixarImagePlugin `
            --nofollow-import-to=PIL.PsdImagePlugin `
            --nofollow-import-to=PIL.SgiImagePlugin `
            --nofollow-import-to=PIL.SpiderImagePlugin `
            --nofollow-import-to=PIL.SunImagePlugin `
            --nofollow-import-to=PIL.TgaImagePlugin `
            --nofollow-import-to=PIL.WebPImagePlugin `
            --nofollow-import-to=PIL.WmfImagePlugin `
            --nofollow-import-to=PIL.XbmImagePlugin `
            --nofollow-import-to=PIL.XpmImagePlugin `
            --nofollow-import-to=PIL.ImageQt `
            --python-flag=no_docstrings `
            --python-flag=no_site `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=img\icon.ico `
            --include-data-dir=img=img `
            --output-dir=dist `
            --output-filename=pdftools.exe `
            main.pyw

      - name: Fallback to PyInstaller (onedir)
        if: steps.nuitka.outcome != 'success'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --windowed --name pdftools `
            --icon img\icon.ico `
            --add-data "img;img" `
            --collect-all pypdfium2 `
            main.pyw

      - name: Determine build output directory
        id: outdir
        shell: pwsh
        env:
          WS: ${{ github.workspace }}
        run: |
          $candidates = @(
            "$env:WS\dist\main.dist",
            "$env:WS\dist\pdftools"
          )
          foreach (dind indincandidates) {
            if (Test-Path "$d\pdftools.exe") {
              Add-Content -Path env:GITHUBOUTPUT−Value"dir=env:GITHUB_OUTPUT -Value "dir=env:GITHUBO​UTPUT−Value"dir=d"
              Write-Host "Found build at: $d"
              exit 0
            }
          }
          Write-Host "Build output not found"
          Get-ChildItem -Recurse "$env:WS\dist" | Select-Object FullName
          exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-windows
          path: ${{ steps.outdir.outputs.dir }}/

      - name: Smoke test the build
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          Start-Process "$env:BUILD_DIR\pdftools.exe"
          Start-Sleep -Seconds 8
          if (-not (Get-Process pdftools -ErrorAction SilentlyContinue)) {
            Write-Host "App crashed on launch"; exit 1
          }
          Stop-Process -Name pdftools -Force
          Write-Host "App launches fine"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Verify installer.iss exists
        shell: pwsh
        env:
          WS: ${{ github.workspace }}
        run: |
          if (-not (Test-Path "$env:WS\installer.iss")) {
            Write-Host "installer.iss NOT FOUND at repo root"
            Get-ChildItem -Force
            exit 1
          }
          Write-Host "installer.iss FOUND"

      - name: Compile installer (setup.exe)
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.outdir.outputs.dir }}
          ISS_PATH: ${{ github.workspace }}\installer.iss
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=4.0.${{ github.run_number }} `
            "/DMySourceDir=$env:BUILD_DIR" `
            "$env:ISS_PATH"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-setup
          path: installer_output/pdftools-setup.exe

      - name: Zip portable build
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          Compress-Archive -Path "$env:BUILD_DIR\*" `
            -DestinationPath "pdftools-portable.zip" -Force

      - name: Publish zip and installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: v4.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            pdftools-portable.zip
            installer_output/pdftools-setup.exe
