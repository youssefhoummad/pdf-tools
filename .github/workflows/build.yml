name: Build Windows EXE
on:
  push:
    branches: [ 4.0 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # مطلوب لإنشاء Release ورفع ملفات إليه
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Try build with Nuitka (standalone, not onefile)
        id: nuitka
        continue-on-error: true
        run: |
          pip install nuitka
          python -m nuitka `
            --standalone `
            --enable-plugin=tk-inter `
            --include-package-data=pypdfium2 `
            --nofollow-import-to=PIL.EpsImagePlugin `
            --nofollow-import-to=PIL.FpxImagePlugin `
            --nofollow-import-to=PIL.GbrImagePlugin `
            --nofollow-import-to=PIL.IcnsImagePlugin `
            --nofollow-import-to=PIL.ImtImagePlugin `
            --nofollow-import-to=PIL.McIdasImagePlugin `
            --nofollow-import-to=PIL.MicImagePlugin `
            --nofollow-import-to=PIL.MspImagePlugin `
            --nofollow-import-to=PIL.PalmImagePlugin `
            --nofollow-import-to=PIL.PcdImagePlugin `
            --nofollow-import-to=PIL.PcxImagePlugin `
            --nofollow-import-to=PIL.PixarImagePlugin `
            --nofollow-import-to=PIL.PsdImagePlugin `
            --nofollow-import-to=PIL.SgiImagePlugin `
            --nofollow-import-to=PIL.SpiderImagePlugin `
            --nofollow-import-to=PIL.SunImagePlugin `
            --nofollow-import-to=PIL.TgaImagePlugin `
            --nofollow-import-to=PIL.WebPImagePlugin `
            --nofollow-import-to=PIL.WmfImagePlugin `
            --nofollow-import-to=PIL.XbmImagePlugin `
            --nofollow-import-to=PIL.XpmImagePlugin `
            --nofollow-import-to=PIL.ImageQt `
            --python-flag=no_docstrings 
            --python-flag=no_site `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=img\icon.ico `
            --include-data-dir=img=img `
            --output-dir=dist `
            --output-filename=pdftools.exe `
            main.pyw
      - name: Fallback to PyInstaller (onedir, not onefile)
        if: steps.nuitka.outcome != 'success'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --windowed --name pdftools `
            --icon img\icon.ico `
            --add-data "img;img" `
            --collect-all pypdfium2 `
            main.pyw
      - name: Upload build (Nuitka)
        if: steps.nuitka.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-windows
          path: dist/main.dist/
      - name: Upload build (PyInstaller)
        if: steps.nuitka.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-windows
          path: dist/pdftools/

      - name: Determine build output directory
        id: outdir
        shell: pwsh
        run: |
          if (Test-Path "dist/main.dist/pdftools.exe") {
            "dir=dist/main.dist" >> $env:GITHUB_OUTPUT
          } else {
            "dir=dist/pdftools" >> $env:GITHUB_OUTPUT
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Verify installer.iss exists (تشخيص)
        shell: pwsh
        run: |
          Write-Host "Current directory: $(Get-Location)"
          if (Test-Path "installer.iss") {
            Write-Host "installer.iss FOUND"
          } else {
            Write-Host "installer.iss NOT FOUND at repo root — this is why ISCC fails"
            Get-ChildItem -Force
            exit 1
          }

      - name: Compile installer (setup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=4.0.${{ github.run_number }} /DMySourceDir="${{ steps.outdir.outputs.dir }}" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-setup
          path: installer_output/pdftools-setup.exe

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.outdir.outputs.dir }}\*" -DestinationPath "pdftools-portable.zip"

      - name: Publish zip and installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: v4.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            pdftools-portable.zip
            installer_output/pdftools-setup.exe
