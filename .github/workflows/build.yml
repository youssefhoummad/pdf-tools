name: Build Windows EXE

on:
  push:
    branches: [ 4.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Try build with Nuitka (standalone, not onefile)
        id: nuitka
        continue-on-error: true
        run: |
          pip install nuitka
          python -m nuitka `
            --standalone `
            --enable-plugin=tk-inter `
            --include-package-data=pypdfium2 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=img\icon.ico `
            --include-data-dir=img=img `
            --output-dir=dist `
            --output-filename=pdftools.exe `
            main.pyw

      - name: Fallback to PyInstaller (onedir, not onefile)
        if: steps.nuitka.outcome != 'success'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --windowed --name pdftools `
            --icon img\icon.ico `
            --add-data "img;img" `
            --collect-all pypdfium2 `
            main.pyw

      - name: Upload build (Nuitka)
        if: steps.nuitka.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-windows
          path: dist/main.dist/

      - name: Upload build (PyInstaller)
        if: steps.nuitka.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-windows
          path: dist/pdftools/
